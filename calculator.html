<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display">
                <input type="text" id="display" aria-label="계산 결과" value="0" readonly>
            </div>
            <div class="buttons">
                <button class="btn clear" type="button" onclick="clearDisplay()">C</button>
                <button class="btn clear" type="button" onclick="deleteLast()" aria-label="마지막 문자 삭제">←</button>
                <button class="btn function" type="button" onclick="calculatePercent()">%</button>
                <button class="btn operator" type="button" onclick="appendOperator('÷')">÷</button>

                <button class="btn number" type="button" onclick="appendNumber('7')">7</button>
                <button class="btn number" type="button" onclick="appendNumber('8')">8</button>
                <button class="btn number" type="button" onclick="appendNumber('9')">9</button>
                <button class="btn operator" type="button" onclick="appendOperator('×')">×</button>

                <button class="btn number" type="button" onclick="appendNumber('4')">4</button>
                <button class="btn number" type="button" onclick="appendNumber('5')">5</button>
                <button class="btn number" type="button" onclick="appendNumber('6')">6</button>
                <button class="btn operator" type="button" onclick="appendOperator('-')">-</button>

                <button class="btn number" type="button" onclick="appendNumber('1')">1</button>
                <button class="btn number" type="button" onclick="appendNumber('2')">2</button>
                <button class="btn number" type="button" onclick="appendNumber('3')">3</button>
                <button class="btn operator" type="button" onclick="appendOperator('+')">+</button>

                <button class="btn function" type="button" onclick="toggleSign()">±</button>
                <button class="btn number zero" type="button" onclick="appendNumber('0')">0</button>
                <button class="btn number" type="button" onclick="appendNumber('.')">.</button>
                <button class="btn equals" type="button" onclick="calculate()">=</button>
            </div>
        </div>
        
        <!-- 계산 기록 영역 -->
        <div class="history-panel" id="history">
            <div class="history-empty">계산 기록이 없습니다</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
